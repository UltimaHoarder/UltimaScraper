[project]
site_name = "UltimaScraper Documentation"
site_description = "WebUI-first control plane for PostgreSQL and Redis-backed scraping workflows"
site_author = "UltimaScraper"
site_url = "https://ultimahoarder.github.io/UltimaScraper/"
repo_name = "UltimaHoarder/UltimaScraper"
repo_url = "https://github.com/UltimaHoarder/UltimaScraper"
copyright = "Copyright &copy; 2026 UltimaScraper"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
      { "Overview" = "getting-started/index.md" },
      { "Quickstart with Docker" = "getting-started/quickstart.md" },
      { "Native Development" = "getting-started/native-development.md" },
  ]},
  { "User Guide" = [
      { "Overview" = "user-guide/index.md" },
      { "WebUI & Multi-Backend" = "user-guide/webui-overview.md" },
      { "Profiles & Authentications" = "user-guide/accounts-profiles.md" },
      { "Job Execution & Telemetry" = "user-guide/job-management.md" },
      { "Content & Media Explorer" = "user-guide/media-explorer.md" },
      { "Multi-Performer Streaming (MPS)" = "user-guide/mps.md" },
      { "Database Maintenance & Tools" = "user-guide/database-maintenance.md" },
  ]},
  { "Operations" = [
      { "Docker & Containers" = "operations/docker.md" },
      { "Setup Wizard & Installer" = "operations/installer.md" },
      { "WebUI Server" = "operations/webui-server.md" },
      { "Security & Auth" = "operations/security.md" },
      { "Database Writer" = "operations/database-writer.md" },
      { "Upgrades & Migrations" = "operations/upgrades.md" },
      { "Release Candidate" = "operations/release-candidate.md" },
  ]},
  { "Architecture" = [
      { "System Architecture" = "architecture/overview.md" },
      { "Plugin System" = "architecture/plugin-system.md" },
  ]},
  { "Reference" = [
      { "Environment Variables" = "reference/environment-reference.md" },
      { "License" = "reference/license.md" },
  ]},
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
