services:
  # One image runs every role: it is built once here, and the worker and WebUI
  # services run the same local image.
  backend:
    image: ${USR_IMAGE:-ultimascraper}:${USR_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        USR_REQUIRE_WHEELHOUSE: ${USR_REQUIRE_WHEELHOUSE:-1}
        USR_VERSION: ${USR_VERSION:-dev}

  worker:
    image: ${USR_IMAGE:-ultimascraper}:${USR_VERSION:-dev}
    pull_policy: never

  webui:
    image: ${USR_IMAGE:-ultimascraper}:${USR_VERSION:-dev}
    pull_policy: never
