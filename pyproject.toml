[project]
name = "ultimascraper"
version = "0.1.0"
description = "WebUI-first control plane for PostgreSQL and Redis-backed scraping workflows"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ultima-scraper-backend>=0.2.0,<1",
    "platformdirs>=4.5,<5",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[dependency-groups]
# The WebUI server: main.py serves it natively (ultima_webui_server.launcher),
# and the image runs it as its webui role. Kept out of the release wheel.
webui = [
    "ultima-scraper-webui-server",
]
dev = [
    { include-group = "webui" },
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fakeredis[lua]>=2.34.1",
    "pytest-cov>=7.0.0",
]
docs = [
    "zensical>=0.0.72",
]

[tool.setuptools]
py-modules = ["main"]

[project.scripts]
ultimascraper = "main:cli_main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
# The siblings come from PyPI. To work on one, see CONTRIBUTING.md.
ultima-scraper-webui-server = { path = "src/UltimaScraperWeb", editable = true }
