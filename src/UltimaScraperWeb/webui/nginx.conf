map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Docker's embedded DNS. Resolving the backend at request time lets the WebUI
# start, and keep running, in deployments without a local backend service.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream usr_backend {
    zone usr_backend 64k;
    server backend:21121 resolve;
    keepalive 16;
}

server {
    listen 21120;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location ~ ^/(api|workers|control)(/|$) {
        proxy_pass http://usr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/ws(/|$) {
        proxy_pass http://usr_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
