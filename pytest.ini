[pytest]
pythonpath = . src/UltimaScraperWeb
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    -v
norecursedirs = 
    .git
    __pycache__
    dist
    build
    *.egg
    __user_data__
    logs
    documentation

console_output_style = progress
log_cli = false
log_cli_level = INFO
